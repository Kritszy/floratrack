        <h2 style="font-size:18px">Stock history</h2>
        ${hist.length ? `<div class="card" style="padding:4px 16px">${hist.map(m => `<div class="history"><span class="q" style="background:${m.qty > 0 ? '#E3F1E0' : 'var(--red-bg)'};color:${m.qty > 0 ? 'var(--leaf)' : 'var(--red)'}">${m.qty > 0 ? '+' : ''}${m.qty}</span>
          <span style="flex:1"><b style="font-weight:600">${m.type==='sale' ? 'Sold' : m.type==='new' ? 'Initial stock' : 'Restocked'}</b>${m.note ? `<div class="sub">${esc(m.note)}</div>` : ''}</span><span class="sub">${fmtDate(m.at)}</span></div>`).join('')}</div>` : '<div class="sub">No stock movements yet.</div>'}
        <button class="btn danger" data-act="delete" data-id="${it.id}">${ic('trash','sm')} Delete plant</button>
      </div></div>${nav('inventory')}`;
  },

  // 7. Add / Edit plant
  edit(id){
    const existing = id && id !== 'new' ? itemById(id) : null;
    if (!draft || draft.forId !== (existing ? existing.id : 'new')){
      draft = existing ? {...existing, color:existing.color || '', forId:existing.id} : {forId:'new', id:'draft-' + uid(), name:'', sci:'', family:'', color:'', category:CATEGORIES[0], care:'Easy', qty:'', price:'', low:5, desc:'', photo:null, blob:null};
    }
    const d = draft;
    const otherColor = d.colorOther || (d.color && !COLORS[d.color]);
    return `<div class="screen no-nav">${topbar(existing ? 'Edit Plant' : 'Add Plant', existing ? 'item/' + existing.id : 'inventory')}
      <div class="pad">
        <div class="group" style="padding:12px">
          <div style="display:flex;gap:12px">
            ${art(d, 'big')}
            <div style="flex:1;display:flex;flex-direction:column;gap:8px">
              <button class="btn soft" data-act="photo-camera">${ic('camera','sm')} ${d.photo ? 'Retake' : 'Take photo'}</button>
              <button class="btn soft" data-act="photo-gallery">${ic('image','sm')} Gallery</button>
            </div>
          </div>
          ${d.blob && !existing ? `<button class="btn dark" data-act="identify-draft" id="id-btn">${ic('sparkle','sm')} Fill in name from photo</button>` : ''}
          <div id="id-msg"></div>
        </div>
        <div class="group">
          <h3>Plant</h3>
          <label class="f">Plant name<input class="input" id="e-name" maxlength="60" value="${esc(d.name)}" placeholder="e.g. Monstera Deliciosa"></label>
          <label class="f">Scientific name <span class="hint">Used to match scans to your stock</span><input class="input" id="e-sci" maxlength="80" value="${esc(d.sci)}" placeholder="e.g. Monstera deliciosa"></label>
          <div class="grid2">
            <label class="f">Category<select class="input" id="e-cat">${CATEGORIES.map(c => `<option ${c===d.category?'selected':''}>${c}</option>`).join('')}</select></label>
            <label class="f">Family<input class="input" id="e-family" maxlength="40" value="${esc(d.family)}" placeholder="e.g. Araceae"></label>
          </div>
        </div>
        <div class="group">
          <h3>Flower color <span class="sub" style="font-weight:400;font-size:13px">· each color has its own stock</span></h3>
          <div class="swatches" role="group" aria-label="Flower color">
            <button type="button" class="sw ${!d.color && !otherColor ? 'on' : ''}" data-act="pick-color" data-color="">None</button>
            ${Object.keys(COLORS).map(c => `<button type="button" class="sw ${d.color === c && !otherColor ? 'on' : ''}" data-act="pick-color" data-color="${c}">${colorDot(c)}${c}</button>`).join('')}
            <button type="button" class="sw ${otherColor ? 'on' : ''}" data-act="pick-color" data-color="__other">Other...</button>
          </div>
          ${otherColor ? `<label class="f">Color name<input class="input" id="e-color" maxlength="24" value="${esc(d.color)}" placeholder="e.g. Light Pink, Red-White"></label>` : ''}
        </div>
        <div class="group">
          <h3>Stock &amp; price</h3>
          <div class="grid2">
            <label class="f">Quantity<input class="input" id="e-qty" inputmode="numeric" value="${esc(d.qty)}" placeholder="0" ${existing ? 'disabled' : ''}></label>
            <label class="f">Price (₱)<input class="input" id="e-price" inputmode="decimal" value="${esc(d.price)}" placeholder="0.00"></label>
          </div>
          ${existing ? '<div class="sub" style="margin-top:-6px">To change the quantity, use Sell or Add stock on the plant page.</div>' : ''}
          <div class="grid2">
            <label class="f">Low-stock alert at<input class="input" id="e-low" inputmode="numeric" value="${esc(d.low)}"></label>
            <label class="f">Care level<select class="input" id="e-care">${CARE.map(c => `<option ${c===d.care?'selected':''}>${c}</option>`).join('')}</select></label>
          </div>
        </div>
        <div class="group">
          <h3>Description</h3>
          <textarea class="input" id="e-desc" maxlength="600" placeholder="Short description of the plant" aria-label="Description">${esc(d.desc)}</textarea>
        </div>
        <div id="e-err"></div>
        <button class="btn" data-act="save-plant">${existing ? 'Save changes' : 'Add to inventory'}</button>
      </div></div>`;
  },

  // 4. Scanner (camera)
  scan(){
    return `<div class="scanner">
      <div class="topbar"><button class="icon-btn" data-back="home" aria-label="Back">${ic('back')}</button><h1>Identify Plant</h1><button class="icon-btn" id="torch" data-act="torch" aria-label="Flash" aria-pressed="false">${ic('flash')}</button><button class="icon-btn" data-act="flip" aria-label="Switch camera">${ic('flip')}</button></div>
      <div class="viewfinder"><video id="video" autoplay playsinline muted></video><div class="vf-msg" id="vf-msg">Starting camera...</div><div class="frame"><i></i><i></i><i></i><i></i></div></div>
      <div class="organs" role="group" aria-label="What does the photo show?">${['auto','leaf','flower','fruit','bark'].map(o => `<button class="chip ${scan.organ===o?'on':''}" data-organ="${o}">${o === 'auto' ? 'Auto' : cap(o)}</button>`).join('')}</div>
      <div class="shutter-row">
        <button class="round" data-act="scan-gallery" aria-label="Choose from gallery">${ic('image')}</button>
        <button class="shutter" id="shutter" aria-label="Take photo" disabled></button>
        <button class="round" data-act="scan-camera-app" aria-label="Use camera app">${ic('camera')}</button>
      </div>
      <p style="text-align:center;margin:6px 16px calc(18px + env(safe-area-inset-bottom));font-size:14px;opacity:.8">Fill the frame with one plant. Leaves and flowers work best.</p>
    </div>`;
  },

  // 5. Identification result + stock check
  result(){
    if (!scan.blob){ setTimeout(() => location.replace('#/scan')); return ''; }
    const ms = scan.data?.matches || [];
    const top = ms[0];
    const ringConf = c => { const r = 28, len = 2 * Math.PI * r;
      return `<div class="ring-conf" aria-label="${c}% confidence"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="${r}" stroke="rgba(255,255,255,.2)" stroke-width="6" fill="none"/>
        <circle cx="34" cy="34" r="${r}" stroke="${c >= 50 ? '#B5E06C' : '#F6C453'}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${len * c / 100} ${len}"/></svg><b>${Math.round(c)}%</b></div>`; };
    const hero = (title, sub, extra='') => `<div class="photo-hero" style="background-image:url('${scan.url}')">
      ${scan.busy ? '<div class="scanline"></div>' : ''}
      <div class="bar-top"><button class="icon-btn" data-back="scan" aria-label="Back">${ic('back')}</button><button class="icon-btn" data-go="scan" aria-label="Scan again">${ic('camera')}</button></div>
      <div class="caption"><div style="flex:1;min-width:0">${title}${sub}</div>${extra}</div></div>`;
    if (scan.busy) return `<div class="screen">${hero('<h1>Identifying...</h1>', '<div class="sci" style="font-style:normal">Checking the plant and your stock</div>')}</div>${nav('scan')}`;
    if (scan.error) return `<div class="screen">${hero('<h1>Couldn\'t identify</h1>', '')}<div class="pad"><div class="err">${esc(scan.error)}</div><button class="btn" data-act="retry-scan">Try again</button><button class="btn ghost" data-go="scan">Scan another photo</button></div></div>${nav('scan')}`;
    if (!top) return `<div class="screen">${hero('<h1>No plant found</h1>', '')}<div class="pad"><div class="warn">No plant was recognized. Try a closer, well-lit photo of a single leaf or flower.</div>
      <button class="btn" data-go="scan">Scan again</button><button class="btn ghost" data-act="add-from-scan">Add to inventory anyway</button></div></div>${nav('scan')}`;
    const low = top.confidence < 50;
    const {exact, similar} = stockMatches(ms);
    const available = exact.filter(i => i.qty > 0);
    const offer = similar.filter(x => x.it.qty > 0);
    const stockCard = (it, reason) => `<button class="stock-card ${reason ? '' : 'match'}" data-item="${it.id}">
        ${art(it, 's64')}
        <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(it.name)}</div><div class="sub">${peso(it.price)} · ${esc(it.category)}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${reason ? `<span class="tag why">${esc(reason)}</span>` : ''}${colorTag(it)}${levelTag(it)}</div></div>
        <div style="text-align:center"><div class="stock-big" style="font-size:30px;color:${level(it)==='out' ? 'var(--red)' : 'var(--canopy)'}">${it.qty}</div><div class="sub">in stock</div></div></button>`;
    let stockHtml;
    if (available.length){
      stockHtml = exact.map(i => stockCard(i)).join('') + (exact.length === 1 ? `<div class="btn-row"><button class="btn" data-act="sell" data-id="${exact[0].id}">${ic('cart','sm')} Sell</button><button class="btn soft" data-act="restock" data-id="${exact[0].id}">${ic('plus','sm')} Add stock</button></div>` : '')
        + (offer.length ? `<div class="sub" style="margin-top:4px">Other plants you have that look similar</div>${offer.map(x => stockCard(x.it, x.reason)).join('')}` : '');
    } else {
      stockHtml = (exact.length ? exact.map(i => stockCard(i)).join('') + `<button class="btn soft" data-act="restock" data-id="${exact[0].id}">${ic('plus','sm')} Add stock</button>` : '')
        + (offer.length
          ? `<div class="info"><b>${exact.length ? 'Out of stock' : "You don't have this plant"}, but you have ${offer.length} similar-looking plant${offer.length > 1 ? 's' : ''} to offer:</b></div>${offer.map(x => stockCard(x.it, x.reason)).join('')}`
          : `<div class="info"><b>${exact.length ? 'Out of stock' : 'Not in your stock yet'}.</b> ${similar.length ? 'Similar plants you carry are also out of stock.' : 'No similar plants in your stock.'}${exact.length ? '' : ' Add it to your inventory with this photo.'}</div>`);
    }
    return `<div class="screen">${hero(`<h1>${esc(displayName(top))}</h1>`, `<div class="sci">${esc(top.scientific_name)}</div>`, ringConf(top.confidence))}
      <div class="pad">
      ${low ? '<div class="warn"><b>Not very sure.</b> Try a closer, well-lit photo of a leaf or flower, and pick what it shows on the scan screen.</div>' : ''}
      <div class="section-h"><h2>In your stock</h2>${exact.length > 1 ? `<span class="sub">${exact.length} colors</span>` : ''}</div>
      ${exact.length > 1 ? '<div class="sub" style="margin-top:-6px">Tap a color to sell or add stock.</div>' : ''}
      ${stockHtml}
      ${exact.length ? `<button class="btn ghost" data-act="add-from-scan">${ic('plus','sm')} Add another color</button>` : `<button class="btn" data-act="add-from-scan">${ic('plus','sm')} Add to inventory</button>`}
      <h2 style="font-size:18px;margin-top:4px">About this plant</h2>
      <div class="facts"><div class="fact"><small>Family</small><b>${esc(top.family || '—')}</b></div><div class="fact"><small>Genus</small><b>${esc(top.genus || '—')}</b></div></div>
      ${(top.common_names||[]).length > 1 ? `<div class="sub">Also called ${esc(top.common_names.slice(1,4).join(', '))}</div>` : ''}
      ${scan.data.description ? `<div style="line-height:1.65;color:#33413A">${esc(scan.data.description)}</div>` : ''}
      ${ms.length > 1 ? `<div class="card"><div style="font-weight:700;margin-bottom:10px">Other possibilities</div>${ms.slice(1).map(m => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0"><span style="flex:1;min-width:0">${esc(displayName(m))}<div class="sub" style="font-style:italic">${esc(m.scientific_name)}</div></span>
        <div class="meter" style="width:70px"><i style="width:${m.confidence}%;background:var(--leaf)"></i></div><span class="sub num" style="width:40px;text-align:right">${m.confidence}%</span></div>`).join('')}</div>` : ''}
      <button class="btn ghost" data-go="scan">${ic('camera','sm')} Scan again</button>
      <p class="sub" style="margin:0">General reference only. Don't eat or use a plant medicinally based on an app identification.</p>
    </div></div>${nav('scan')}`;
  },

  // 9. New sale
  sale(){
    const items = S.items.filter(i => i.qty > 0 || cart[i.id]).sort((a, b) => a.name.localeCompare(b.name) || (a.color || '').localeCompare(b.color || ''));
    const count = Object.values(cart).reduce((a, b) => a + b, 0);
    const total = items.reduce((a, i) => a + (cart[i.id] || 0) * i.price, 0);
    return `<div class="screen" style="padding-bottom:220px">${topbar('New Sale','home')}
      <div class="pad">
        <div class="search">${ic('search','sm')}<input id="sale-q" placeholder="Search plant..." aria-label="Search plants to sell"></div>
        <div id="sale-list" class="list">
        ${items.length ? items.map(i => `<div class="row-item" data-name="${esc(nameKey(i))}" style="${cart[i.id] ? 'box-shadow:inset 0 0 0 2px var(--leaf),var(--shadow)' : ''}">${art(i)}
          <div class="t"><div class="name">${esc(i.name)}</div><div class="price">${peso(i.price)}</div><div class="sub">${i.color ? `${colorDot(i.color)} ${esc(i.color)} · ` : ''}${i.qty} in stock</div></div>
          <div class="qty"><button data-cart="${i.id}" data-d="-1" aria-label="One less ${esc(fullName(i))}">${ic('minus','sm')}</button><b>${cart[i.id] || 0}</b><button data-cart="${i.id}" data-d="1" aria-label="One more ${esc(fullName(i))}">${ic('plus','sm')}</button></div></div>`).join('')
          : emptyBox('sale-empty','Nothing to sell yet','Plants with stock appear here. Add stock in Inventory first.')}
        </div>
      </div>
      <div class="total-bar">
        <div style="flex:1"><div style="font-size:13px;opacity:.8">${count} item${count === 1 ? '' : 's'}</div><div class="num" style="font-size:24px;font-weight:800">${peso(total)}</div></div>
        <button class="btn" data-act="confirm-sale" ${count ? '' : 'disabled'}>Confirm sale</button>
      </div></div>${nav('sale')}`;
  },

  // 10. Reports
  reports(){
    const days = salesByDay(reportDays), from = days[0].d;
    const sales = S.moves.filter(m => m.type === 'sale' && m.at >= from);
    const total = sales.reduce((a, m) => a - m.qty * m.price, 0);
    const sold = sales.reduce((a, m) => a - m.qty, 0);
    const prev = S.moves.filter(m => m.type === 'sale' && m.at >= from - reportDays * DAY && m.at < from).reduce((a, m) => a - m.qty * m.price, 0);
    const change = prev > 0 ? Math.round((total - prev) / prev * 100) : null;
    const top = Object.entries(sales.reduce((acc, m) => { (acc[m.itemId] = acc[m.itemId] || {name:m.name, u:0, v:0}); acc[m.itemId].u -= m.qty; acc[m.itemId].v -= m.qty * m.price; return acc; }, {}))
      .sort((a, b) => b[1].u - a[1].u).slice(0, 5);
    const maxTop = Math.max(1, ...top.map(t => t[1].u));
    return `<div class="screen">${topbar('Reports','home')}
      <div class="pad">
        <div class="chips">${[[7,'7 days'],[30,'30 days'],[90,'90 days']].map(([v,l]) => `<button class="chip ${v===reportDays?'on':''}" data-range="${v}">${l}</button>`).join('')}</div>
        <div class="card" style="background:var(--canopy);color:#fff;position:relative;overflow:hidden">${leavesBg(.12)}
          <div style="position:relative"><div style="opacity:.8;font-size:13px">${fmtDate(from)} – ${fmtDate(Date.now())}</div>
          <div class="num" style="font-size:34px;font-weight:800;margin:4px 0">${peso(total)}</div>
          <div style="display:flex;gap:16px;font-size:13.5px;opacity:.9"><span><b>${sold}</b> plants sold</span><span><b>${sales.length}</b> sales</span>${change !== null ? `<span style="color:${change >= 0 ? 'var(--sprout)' : '#F6A89E'}">${change >= 0 ? '▲' : '▼'} ${Math.abs(change)}% vs previous</span>` : ''}</div></div>
        </div>
        <div class="card chart"><div style="font-weight:700;margin-bottom:8px">Daily sales</div>${lineChart(days)}</div>
        <div class="card"><div style="font-weight:700;margin-bottom:12px">Top selling plants</div>
          <div class="tops">${top.length ? top.map(([iid, t], k) => `<div class="r">${art(itemById(iid) || {id:iid, name:t.name}, 's44')}<div class="t"><span>${esc(t.name)}</span><div class="meter"><i style="width:${t.u / maxTop * 100}%;background:${k === 0 ? 'var(--leaf)' : '#8CC56A'}"></i></div></div><div style="text-align:right"><b class="num">${t.u}</b><div class="sub">${peso(t.v)}</div></div></div>`).join('') : '<div class="sub">No sales in this period.</div>'}</div></div>
        <div class="card"><div style="font-weight:700;margin-bottom:6px">Needs restocking</div>
          ${S.items.filter(i => level(i) !== 'ok').map(i => `<button class="row-item" style="box-shadow:none;padding:8px 0;border-radius:0;border-bottom:1px solid var(--line)" data-item="${i.id}">${art(i, 's44')}<div class="t"><div class="name">${esc(fullName(i))}</div><div class="sub">${i.qty} left</div></div>${levelTag(i)}</button>`).join('') || '<div class="sub">All plants are well stocked.</div>'}</div>
      </div></div>${nav('home')}`;
  },

  // 11. Profile & settings
  profile(){
    const p = S.profile;
    const units = -S.moves.filter(m => m.type === 'sale').reduce((a, m) => a + m.qty, 0);
    const revenue = -S.moves.filter(m => m.type === 'sale').reduce((a, m) => a + m.qty * m.price, 0);
    return `<div class="screen">
      <div class="canopy profile-head">${leavesBg(.18)}
        <div class="row"><button class="icon-btn" data-act="drawer" aria-label="Menu">${ic('menu')}</button><span style="flex:1"></span></div>
        <button class="avatar-wrap" data-act="photo" aria-label="Change profile photo">${avatarHTML()}<span class="cam">${ic('camera')}</span></button>
        <h1 style="font-size:24px">${esc(p.owner)}</h1><div style="opacity:.8">${esc(p.store)}</div>
      </div>
      <div class="pad">
        <div class="grid3" style="margin-top:-46px;position:relative">
          ${[[S.items.length,'Plants'],[units,'Sold'],[peso(revenue),'Revenue']].map(([v,l]) => `<div class="card" style="padding:12px;text-align:center"><b class="num" style="font-size:19px">${v}</b><div class="sub">${l}</div></div>`).join('')}
        </div>
        <div class="menu-list">
          <button data-act="account"><span class="ic">${ic('settings','sm')}</span><span>Account settings</span>${ic('chev','sm')}</button>
          <button data-act="photo"><span class="ic">${ic('user','sm')}</span><span>Profile photo</span>${ic('chev','sm')}</button>
          <button data-act="logo"><span class="ic">${ic('image','sm')}</span><span>Store logo</span>${ic('chev','sm')}</button>
          <button data-act="backup"><span class="ic">${ic('backup','sm')}</span><span>Backup &amp; restore</span>${ic('chev','sm')}</button>
          <button data-act="help"><span class="ic">${ic('help','sm')}</span><span>Help &amp; support</span>${ic('chev','sm')}</button>
          <button data-act="about"><span class="ic">${ic('info','sm')}</span><span>About FloraTrack</span>${ic('chev','sm')}</button>
        </div>
        <button class="btn danger" data-act="reset">Reset app data</button>
        <p class="sub" style="text-align:center;margin:0">${S.moves.length} stock records saved on this phone</p>
      </div></div>${nav('profile')}`;
  },
};

function itemRow(i){
  return `<button class="row-item" data-item="${i.id}">${art(i)}
    <div class="t"><div class="name">${esc(i.name)}</div><div class="sub">${i.color ? `${colorDot(i.color)} ${esc(i.color)} · ` : `${esc(i.category)} · `}<span class="price">${peso(i.price)}</span></div>${meter(i)}</div>
    <div class="qty-col"><b style="color:${level(i)==='out'?'var(--red)':'var(--canopy)'}">${i.qty}</b>${level(i) === 'ok' ? '<span class="sub">in stock</span>' : levelTag(i)}</div></button>`;
}

/** Daily sales area chart (SVG), labels sized to the real values. */
function lineChart(days){
  const W = 340, H = 170, L = 44, R = 10, T = 12, B = 26;
  const max = Math.max(...days.map(d => d.v));
  const top = max <= 0 ? 1000 : Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max)))) * Math.pow(10, Math.floor(Math.log10(max)));
  const x = k => L + (days.length === 1 ? 0 : k * (W - L - R) / (days.length - 1));
  const y = v => T + (H - T - B) * (1 - v / top);
  const pts = days.map((d, k) => `${x(k).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(top * f)}" y2="${y(top * f)}" stroke="#E6EDE3"/><text x="${L - 6}" y="${y(top * f) + 4}" text-anchor="end" font-size="10" fill="#5E6D61">${Math.round(top * f).toLocaleString()}</text>`).join('');
  const ticks = [0, Math.floor((days.length - 1) / 2), days.length - 1].map(k => `<text x="${x(k)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#5E6D61">${new Date(days[k].d).toLocaleDateString('en-PH', {month:'short', day:'numeric'})}</text>`).join('');
  const last = days.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2E7D32" stop-opacity=".28"/><stop offset="1" stop-color="#2E7D32" stop-opacity="0"/></linearGradient></defs>${grid}
    <polygon points="${x(0)},${y(0)} ${pts} ${x(last)},${y(0)}" fill="url(#g)"/>
    <polyline points="${pts}" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(days[last].v)}" r="4.5" fill="#2E7D32" stroke="#fff" stroke-width="2"/>${ticks}</svg>`;
}

// =========================================================================
//  RENDER + EVENTS
// =========================================================================
function render(){
  const parts = location.hash.replace(/^#\//, '').split('/');
  let view = parts[0] || 'splash';
  const arg = parts[1];
  if (!screens[view]) view = 'home';
  if (view !== 'splash' && view !== 'welcome' && !S.profile) view = 'welcome';
  if (view !== 'scan') stopCamera();
  if (view !== 'edit') draft = null;
  closeDrawer(); closeSheet();
  $('#app').innerHTML = screens[view](arg);
  window.scrollTo(0, 0);
  after(view, arg);
}
window.addEventListener('hashchange', render);

function keepFocus(sel, fn){
  const el = $(sel); if (!el) return;
  el.addEventListener('input', () => { const pos = el.selectionStart; fn(el.value); render(); const n = $(sel); n.focus(); n.setSelectionRange(pos, pos); });
}
function after(view){
  if (view === 'home') keepFocus('#home-q', v => homeQuery = v);
  if (view === 'inventory') keepFocus('#inv-q', v => invQuery = v);
  if (view === 'sale'){ $('#sale-q')?.addEventListener('input', e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('#sale-list .row-item').forEach(r => r.hidden = !r.dataset.name.includes(q)); }); }
  if (view === 'scan') startScanner();
}

async function startScanner(){
  const video = $('#video'), msg = $('#vf-msg'), shutter = $('#shutter');
  stopCamera();
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:false});
    if (!video.isConnected){ stopCamera(); return; }
    video.srcObject = stream; msg.hidden = true; shutter.disabled = false;
  }catch(e){
    msg.textContent = 'Live camera isn\'t available here. Use the camera or gallery button below.';
    shutter.disabled = true;
  }
  shutter.onclick = () => {
    if (!video.videoWidth) return;
    const c = $('#canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    c.toBlob(b => runScan(b), 'image/jpeg', 0.9);
  };
}

async function runScan(blob){
  stopCamera();
  if (scan.url) URL.revokeObjectURL(scan.url);
  scan = {...scan, blob, url:URL.createObjectURL(blob), data:null, error:null, busy:true};
  go('result');
  try{ scan.data = await identify(blob, scan.organ); }
  catch(e){ scan.error = e.message; }
  scan.busy = false;
  if (location.hash === '#/result') render();
}

function readDraftFields(){
  if (!draft) return;
  const v = id => $(id) ? $(id).value : undefined;
  if ($('#e-color')) draft.color = $('#e-color').value;
  Object.assign(draft, {name:v('#e-name'), sci:v('#e-sci'), category:v('#e-cat'), care:v('#e-care'), qty:v('#e-qty') ?? draft.qty, price:v('#e-price'), low:v('#e-low'), family:v('#e-family'), desc:v('#e-desc')});
}

function stockSheet(item, type){
  sheet(`<div style="display:flex;gap:12px;align-items:center">${art(item, 's56')}<div><h2>${type === 'sale' ? 'Record sale' : 'Add stock'}</h2><div class="sub" style="font-size:14px">${esc(fullName(item))} · ${item.qty} in stock</div></div></div>
    <div class="sub" style="text-align:center">${type === 'sale' ? 'How many were sold?' : 'How many arrived?'}</div>
    <div class="stepper"><button data-step="-1" aria-label="Less">${ic('minus')}</button><input id="s-qty" inputmode="numeric" value="1" aria-label="Quantity"><button data-step="1" aria-label="More">${ic('plus')}</button></div>
    <label class="f">Note (optional)<input class="input" id="s-note" maxlength="60" placeholder="${type === 'sale' ? 'e.g. walk-in customer' : 'e.g. from supplier'}"></label>
    <div id="s-err"></div><div class="btn-row"><button class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn" id="s-ok">Save</button></div>`);
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { const n = Math.max(1, (parseInt($('#s-qty').value, 10) || 0) + Number(b.dataset.step)); $('#s-qty').value = type === 'sale' ? Math.min(n, Math.max(1, item.qty)) : n; });
  $('#s-ok').onclick = () => {
    const raw = $('#s-qty').value.trim();
    const err = moveStock(item, type, /^\d+$/.test(raw) ? Number(raw) : NaN, $('#s-note').value.trim());
    if (err){ $('#s-err').innerHTML = `<div class="err">${err}</div>`; return; }
    if (!save()) return;
    closeSheet(); render(); toast(type === 'sale' ? `Sale recorded: ${peso(Number(raw) * item.price)}` : `Added ${raw} to ${fullName(item)}.`);
  };
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-back],[data-act],[data-item],[data-filter],[data-cart],[data-organ],[data-range]');
  if (!t) return;
  if (t.dataset.act === 'close-sheet'){ if (e.target === t || t.tagName === 'BUTTON') closeSheet(); return; }
  if (t.dataset.go){ if (t.dataset.go === 'sale') cart = {}; return go(t.dataset.go); }
  if (t.dataset.back){ if (history.length > 1) history.back(); else go(t.dataset.back); return; }
  if (t.dataset.item) return go('item/' + t.dataset.item);
  if (t.dataset.filter){ invFilter = t.dataset.filter; return render(); }
  if (t.dataset.range){ reportDays = Number(t.dataset.range); return render(); }
  if (t.dataset.organ){ scan.organ = t.dataset.organ; document.querySelectorAll('[data-organ]').forEach(c => c.classList.toggle('on', c === t)); return; }
  if (t.dataset.cart){
    const it = itemById(t.dataset.cart); const n = Math.max(0, Math.min(it.qty, (cart[it.id] || 0) + Number(t.dataset.d)));
    if (n === 0) delete cart[it.id]; else cart[it.id] = n;
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  const id = t.dataset.id, item = id && itemById(id);
  switch (t.dataset.act){
    case 'drawer': return openDrawer();
    case 'filter-low': invFilter = 'Low Stock'; return go('inventory');
    case 'welcome': {
      const store = $('#w-store').value.trim(), owner = $('#w-owner').value.trim();
      if (!store || !owner){ $('#w-err').innerHTML = '<div class="err">Enter your store name and your name.</div>'; return; }
      S.profile = {...(S.profile || {}), store, owner}; save(); return location.replace('#/home');
    }
    case 'new-plant': draft = null; return go('edit/new');
    case 'edit': draft = null; return go('edit/' + id);
    case 'sell': return stockSheet(item, 'sale');
    case 'restock': return stockSheet(item, 'in');
    case 'color-filter': invColor = t.dataset.color; return render();
    case 'pick-color': {
      readDraftFields();
      if (t.dataset.color === '__other'){ draft.colorOther = true; if (COLORS[draft.color]) draft.color = ''; }
      else { draft.colorOther = false; draft.color = t.dataset.color; }
      const y = window.scrollY; render(); window.scrollTo(0, y);
      if (draft.colorOther) $('#e-color')?.focus();
      return;
    }
    case 'add-variant': {
      draft = {forId:'new', id:'draft-' + uid(), name:item.name, sci:item.sci || '', family:item.family || '', color:'', category:item.category, care:item.care || 'Easy',
        qty:'', price:item.price, low:item.low, desc:item.desc || '', photo:null, blob:null};
      return go('edit/new');
    }
    case 'logo': return logoSheet();
    case 'photo': return photoSheet();
    case 'avatar-camera': case 'avatar-gallery':
      return pickPhoto(t.dataset.act === 'avatar-camera', async blob => {
        const old = S.profile.photo; S.profile.photo = await makeAvatar(blob);
        if (!save()){ S.profile.photo = old; return; }
        render(); toast('Profile photo updated.'); });
    case 'avatar-remove': delete S.profile.photo; save(); render(); return toast('Profile photo removed.');
    case 'torch': return toggleTorch();
    case 'delete': return confirmSheet('Delete plant?', `This removes <b>${esc(fullName(item))}</b> and its stock history from this phone. This cannot be undone.`, 'Delete', () => {
      S.items = S.items.filter(i => i.id !== id); S.moves = S.moves.filter(m => m.itemId !== id); save(); toast('Plant deleted.'); go('inventory'); });
    case 'photo-camera': case 'photo-gallery':
      readDraftFields();
      return pickPhoto(t.dataset.act === 'photo-camera', async blob => { draft.blob = blob; draft.photo = await thumb(blob); render(); });
    case 'identify-draft': {
      readDraftFields();
      const btn = $('#id-btn'); btn.disabled = true; btn.textContent = 'Identifying...';
      try{
        const data = await identify(draft.blob, 'auto'); const m = (data.matches || [])[0];
        if (!m){ $('#id-msg').innerHTML = '<div class="warn">No plant recognized in this photo. Fill in the name yourself.</div>'; btn.disabled = false; btn.textContent = 'Fill in name from photo'; return; }
        Object.assign(draft, {name:draft.name || displayName(m), sci:m.scientific_name, family:m.family || draft.family, desc:draft.desc || (data.description || '').slice(0, 600)});
        render(); $('#id-msg').innerHTML = `<div class="info">Identified as <b>${esc(displayName(m))}</b> (${m.confidence}%). Check the details, then add quantity and price.</div>`;
      }catch(err){ $('#id-msg').innerHTML = `<div class="err">${esc(err.message)}</div>`; btn.disabled = false; btn.textContent = 'Fill in name from photo'; }
      return;
    }
    case 'save-plant': {
      readDraftFields();
      const d = draft, existing = d.forId !== 'new' ? itemById(d.forId) : null;
      const qty = String(d.qty).trim(), price = String(d.price).trim(), low = String(d.low).trim();
      const err = !d.name.trim() ? 'Enter the plant name.'
        : !existing && !/^\d+$/.test(qty) ? 'Enter the quantity (a whole number).'
        : !(price !== '' && !isNaN(price) && Number(price) >= 0) ? 'Enter a valid price.'
        : !/^\d+$/.test(low) ? 'Enter the low-stock alert level (a whole number).' : '';
      if (err){ $('#e-err').innerHTML = `<div class="err">${err}</div>`; $('#e-err').scrollIntoView({block:'center'}); return; }
      const color = normColor(d.color);
      const twin = S.items.find(i => i.id !== existing?.id && i.name.trim().toLowerCase() === d.name.trim().toLowerCase() && (i.color || '') === color);
      if (twin){ $('#e-err').innerHTML = `<div class="err"><b>${esc(fullName(twin))}</b> is already in your inventory. Open it and use Add stock instead, or pick a different color.</div>`; $('#e-err').scrollIntoView({block:'center'}); return; }
      // Reuse the spelling already in the inventory ("rose" -> "Rose") so one plant never appears under two names.
      const sameName = S.items.find(i => i.id !== existing?.id && i.name.trim().toLowerCase() === d.name.trim().toLowerCase());
      const fields = {name:sameName ? sameName.name : d.name.trim(), sci:d.sci.trim() || sameName?.sci || '', family:d.family.trim(), color, category:d.category, care:d.care, price:Number(price), low:Number(low), desc:d.desc.trim(), photo:d.photo, updatedAt:Date.now()};
      let saved;
      if (existing){ Object.assign(existing, fields); saved = existing; }
      else {
        saved = {id:uid(), qty:0, createdAt:Date.now(), ...fields};
        S.items.push(saved);
        if (Number(qty) > 0){ saved.qty = Number(qty); S.moves.push({id:uid(), itemId:saved.id, name:saved.name, type:'new', qty:Number(qty), price:saved.price, note:'', at:Date.now()}); }
      }
      if (!save()) return;
      draft = null; toast(existing ? 'Changes saved.' : `${fullName(saved)} added to inventory.`);
      location.replace('#/item/' + saved.id); return;
    }
    case 'scan-gallery': return pickPhoto(false, runScan);
    case 'scan-camera-app': return pickPhoto(true, runScan);
    case 'flip': facing = facing === 'environment' ? 'user' : 'environment'; $('#torch')?.classList.remove('torch-on'); return startScanner();
    case 'retry-scan': return runScan(scan.blob);
    case 'add-from-scan': {
      const m = (scan.data && scan.data.matches || [])[0];
      const same = m ? stockMatches(scan.data.matches).exact[0] : null;   // adding another color of a plant already in stock
      draft = {forId:'new', id:'draft-' + uid(), name:same ? same.name : m ? displayName(m) : '', sci:m ? m.scientific_name : '', family:m?.family || '', color:'',
        category:same ? same.category : CATEGORIES[0], care:same?.care || 'Easy', qty:'', price:same ? same.price : '', low:same ? same.low : 5,
        desc:(scan.data?.description || '').slice(0, 600), photo:await thumb(scan.blob), blob:null};
      return go('edit/new');
    }
    case 'confirm-sale': {
      const lines = Object.entries(cart).filter(([, q]) => q > 0);
      for (const [cid, q] of lines){ const it = itemById(cid); if (!it || q > it.qty) return toast(`${it ? fullName(it) : 'A plant'}: not enough stock.`); }
      let total = 0;
      lines.forEach(([cid, q]) => { const it = itemById(cid); total += q * it.price; moveStock(it, 'sale', q); });
      if (!save()) return;
      cart = {}; render(); return toast(`Sale recorded: ${peso(total)}`);
    }
    case 'account': {
      sheet(`<h2>Account settings</h2>
        <label class="f">Store name<input class="input" id="a-store" maxlength="40" value="${esc(S.profile.store)}"></label>
        <label class="f">Your name<input class="input" id="a-owner" maxlength="30" value="${esc(S.profile.owner)}"></label>
        <div id="a-err"></div><div class="btn-row"><button class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn" id="a-ok">Save</button></div>`);
      $('#a-ok').onclick = () => { const s = $('#a-store').value.trim(), o = $('#a-owner').value.trim();
        if (!s || !o){ $('#a-err').innerHTML = '<div class="err">Both fields are required.</div>'; return; }
        S.profile = {...S.profile, store:s, owner:o}; save(); closeSheet(); render(); toast('Saved.'); };
      return;
    }
    case 'backup':
      sheet(`<h2>Backup &amp; restore</h2><p class="sub" style="font-size:15px;margin:0">Your plants and sales are stored only on this phone. Save a backup file regularly, for example to Google Drive.</p>
        <button class="btn" id="b-save">${ic('backup','sm')} Save backup file</button>
        <button class="btn ghost" id="b-load">Restore from backup file</button><div id="b-msg"></div>`);
      $('#b-save').onclick = exportBackup;
      $('#b-load').onclick = () => { $('#pick-backup').value = ''; $('#pick-backup').click(); };
      return;
    case 'help':
      return sheet(`<h2>Help &amp; support</h2><div style="line-height:1.7;display:flex;flex-direction:column;gap:10px">
        <div><b>Check stock with a photo.</b> Tap Scan, photograph the plant, and FloraTrack identifies it and shows how many you have.</div>
        <div><b>Customer shows a plant you don't stock?</b> Scan it. FloraTrack lists similar-looking plants you have: same genus or family, or plants the photo could also be.</div>
        <div><b>Add a new plant.</b> On the scan result tap Add to inventory, or in Inventory tap Add plant, take a photo, then Fill in name from photo.</div>
        <div><b>Record sales.</b> Use New sale for several plants at once, or Sell on a plant's page.</div>
        <div class="sub">Scans match your stock by scientific name and family, so keep those filled in. Identification needs internet; your stock list works offline.</div></div>
        <button class="btn" data-act="close-sheet">Got it</button>`);
    case 'about':
      return sheet(`<div style="display:flex;gap:14px;align-items:center"><span class="art s64" style="border-radius:50%">${plantSVG('about','Indoor','monstera')}</span><div><h2>FloraTrack</h2><div class="sub">Version 2.3</div></div></div>
        <p style="line-height:1.7;margin:0">A CNN-powered plant identification and inventory management system for small-scale plant vendors. Plant identification by the Pl@ntNet API (deep-learning image recognition). Descriptions from Wikipedia.</p><button class="btn" data-act="close-sheet">Close</button>`);
    case 'reset':
      return confirmSheet('Reset app data?', 'This deletes all plants, sales and your store profile from this phone. Save a backup first if you may need them.', 'Delete everything', () => {
        S = emptyState(); save(); cart = {}; go('welcome'); });
  }
});
// tap outside a bottom sheet closes it
document.addEventListener('click', e => { if (e.target.classList && e.target.classList.contains('sheet-bg')) closeSheet(); });

// ---------- store logo ----------
function logoSheet(){
  sheet(`<h2>Store logo</h2>
    <div class="logo-edit">${logoHTML()}<p class="sub" style="margin:0;font-size:14.5px">Shown at the top of the Home screen and in the menu. A square image or PNG with a clear background looks best.</p></div>
    <button class="btn" id="l-pick">${ic('image','sm')} ${S.profile.logo ? 'Change logo' : 'Upload logo'}</button>
    ${S.profile.logo ? '<button class="btn ghost" id="l-remove">Use default logo</button>' : ''}
    <div id="l-msg"></div>`);
  $('#l-pick').onclick = () => { $('#pick-logo').value = ''; $('#pick-logo').click(); };
  $('#l-remove') && ($('#l-remove').onclick = () => { delete S.profile.logo; save(); render(); toast('Default logo restored.'); });
}
$('#pick-logo').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try{
    const old = S.profile.logo;
    S.profile.logo = await makeLogo(f);
    if (!save()){ S.profile.logo = old; return; }
    render(); toast('Logo updated.');
  }catch(err){ toast('Could not read that image.'); }
});

// ---------- backup ----------
function exportBackup(){
  const name = `floratrack-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const content = JSON.stringify({app:'FloraTrack', version:1, savedAt:Date.now(), data:S});
  if (window.AndroidBridge && AndroidBridge.saveFile){
    const ok = AndroidBridge.saveFile(name, 'application/json', content);
    $('#b-msg').innerHTML = ok ? '<div class="info">Choose where to save the backup (e.g. Google Drive).</div>' : '<div class="err">Could not create the backup file.</div>';
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:'application/json'})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  $('#b-msg').innerHTML = '<div class="info">Backup downloaded.</div>';
}
$('#pick-backup').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try{
    const parsed = JSON.parse(await f.text());
    const data = parsed.data || parsed;
    if (!Array.isArray(data.items) || !Array.isArray(data.moves)) throw new Error('bad');
    confirmSheet('Restore backup?', `This replaces the data on this phone with the backup (${data.items.length} plants, ${data.moves.length} records).`, 'Restore', () => {
      S = {profile:data.profile || S.profile, items:data.items, moves:data.moves}; save(); toast('Backup restored.'); go('home'); });
  }catch(err){ toast('That file is not a FloraTrack backup.'); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});
if (!location.hash) location.replace('#/splash');
render();
</script>
