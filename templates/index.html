<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FloraTrack</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#173F27">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one phone-width column; deep "canopy" headers over a pale mist page;
     plants without photos get a generated potted-plant illustration. */
  :root{
    --canopy:#173F27; --canopy-2:#1F5132; --leaf:#2E7D32; --leaf-2:#3E9142; --sprout:#B5E06C;
    --mist:#EEF4EC; --paper:#F7FAF5; --white:#FFFFFF; --ink:#18241B; --muted:#5E6D61; --line:#DCE6D8;
    --amber:#A86400; --amber-bg:#FFF0D2; --red:#C2362B; --red-bg:#FCE6E3; --violet:#6A4FBF; --violet-bg:#EEEAFB; --sky:#1F6FB2; --sky-bg:#E5F0FA;
    --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --body:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --r-lg:22px; --r-md:16px; --r-sm:12px;
    --shadow:0 1px 2px rgba(23,63,39,.06), 0 6px 18px rgba(23,63,39,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{background:#DDE7DA; color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45; display:flex; justify-content:center;}
  button,input,select,textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--sprout); outline-offset:2px;}
  .app{width:100%; max-width:480px; min-height:100vh; background:var(--paper); position:relative;}
  .screen{padding-bottom:calc(140px + env(safe-area-inset-bottom)); animation:enter .18s ease-out;}
  .screen.no-nav{padding-bottom:28px;}
  @keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .pad{padding:18px 16px; display:flex; flex-direction:column; gap:16px;}
  svg.i{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none;}
  svg.i.sm{width:18px; height:18px;} svg.i.lg{width:28px; height:28px;}
  h1,h2,h3,.display{font-family:var(--display); letter-spacing:-.01em; margin:0;}
  .sub{color:var(--muted); font-size:13px;}
  .num{font-family:var(--display); font-variant-numeric:tabular-nums;}

  /* headers */
  .topbar{position:sticky; top:0; z-index:5; background:rgba(247,250,245,.92); backdrop-filter:blur(10px); display:flex; align-items:center; gap:8px; padding:calc(10px + env(safe-area-inset-top)) 10px 10px; border-bottom:1px solid var(--line);}
  .topbar h1{flex:1; text-align:center; font-size:18px; font-weight:700;}
  .icon-btn{background:none; border:0; width:42px; height:42px; border-radius:var(--r-sm); display:grid; place-items:center; color:inherit;}
  .icon-btn:active{background:rgba(0,0,0,.06);}
  .canopy{position:relative; overflow:hidden; background:var(--canopy); color:#fff; border-radius:0 0 30px 30px; padding:calc(12px + env(safe-area-inset-top)) 16px 20px;}
  .canopy > *{position:relative;}
  .canopy .leaves{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .canopy .row{display:flex; align-items:center; gap:10px;}
  .canopy .icon-btn{color:#fff;}
  .greet{font-family:var(--display); font-size:26px; font-weight:700; line-height:1.15; margin:10px 0 2px;}
  .avatar{width:42px; height:42px; border-radius:50%; background:var(--sprout); color:var(--canopy); display:grid; place-items:center; font-family:var(--display); font-weight:800; border:0;}
  .search{display:flex; align-items:center; gap:10px; background:var(--white); color:var(--muted); border-radius:var(--r-md); padding:0 14px; height:50px; border:1px solid var(--line); min-width:0;}
  .search input{border:0; outline:0; flex:1; background:transparent; color:var(--ink); min-width:0;}
  .canopy .search{border:0; box-shadow:0 6px 20px rgba(0,0,0,.18);}

  /* stock health bar */
  .health{background:rgba(255,255,255,.1); border-radius:var(--r-md); padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
  .health-bar{display:flex; height:10px; border-radius:6px; overflow:hidden; background:rgba(255,255,255,.15); gap:2px;}
  .health-bar i{display:block; height:100%;}
  .legend{display:flex; gap:14px; font-size:12.5px; flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:6px;}
  .legend b{font-family:var(--display);}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

  /* cards */
  .card{background:var(--white); border-radius:var(--r-lg); padding:16px; box-shadow:var(--shadow);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat{display:flex; flex-direction:column; gap:10px; padding:14px;}
  .stat .ic{width:40px; height:40px; border-radius:var(--r-sm); display:grid; place-items:center;}
  .stat small{color:var(--muted); font-size:12.5px;}
  .stat b{font-family:var(--display); font-size:22px; font-weight:700; line-height:1;}
  .section-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .section-h h2{font-size:18px; font-weight:700;}
  .link{background:none; border:0; color:var(--leaf); font-weight:600; padding:0; font-size:14px;}

  /* scan hero card */
  .scan-card{position:relative; overflow:hidden; border:0; border-radius:var(--r-lg); background:linear-gradient(135deg,var(--leaf) 0%, var(--canopy-2) 100%); color:#fff; padding:18px; display:flex; align-items:center; gap:16px; text-align:left; box-shadow:0 10px 24px rgba(46,125,50,.28);}
  .scan-card .lens{width:64px; height:64px; border-radius:50%; border:3px solid var(--sprout); display:grid; place-items:center; flex:none; background:rgba(255,255,255,.08);}
  .scan-card h3{font-size:20px;}
  .scan-card p{margin:2px 0 0; font-size:13.5px; opacity:.85;}
  .tile{border:0; border-radius:var(--r-lg); padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--white); color:var(--ink); font-weight:600; font-size:13.5px; box-shadow:var(--shadow);}
  .tile .ic{width:44px; height:44px; border-radius:14px; display:grid; place-items:center;}

  /* sparkline */
  .spark{display:flex; align-items:flex-end; gap:6px; height:64px;}
  .spark div{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end;}
  .spark i{width:100%; border-radius:6px 6px 3px 3px; background:var(--mint, #CFE6CB); min-height:4px;}
  .spark div.today i{background:var(--leaf);}
  .spark span{font-size:10.5px; color:var(--muted);}

  /* horizontal restock scroller */
  .hscroll{display:flex; gap:12px; overflow-x:auto; padding:2px 16px 8px; margin:0 -16px; scroll-snap-type:x mandatory;}
  .mini{flex:0 0 150px; scroll-snap-align:start; border:0; background:var(--white); border-radius:var(--r-lg); padding:10px; text-align:left; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;}
  .mini .art{width:100%; aspect-ratio:1.25; border-radius:14px;}
  .mini b{font-size:14px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* plant art + photos */
  .art{background:var(--mist) center/cover no-repeat; border-radius:var(--r-sm); overflow:hidden; flex:none; display:block;}
  .art svg{width:100%; height:100%; display:block;}
  .art.s56{width:56px; height:56px;} .art.big{width:120px; height:120px; border-radius:14px;} .art.s64{width:64px; height:64px;} .art.s44{width:44px; height:44px; border-radius:10px;}

  /* activity timeline */
  .feed{display:flex; flex-direction:column;}
  .feed .it{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
  .feed .it:last-child{border-bottom:0;}
  .feed .t{flex:1; min-width:0;}
  .feed .t div:first-child{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .amt{font-family:var(--display); font-weight:700; white-space:nowrap;}
  .amt.pos{color:var(--leaf);} .amt.neg{color:var(--red);}

  /* inventory rows */
  .list{display:flex; flex-direction:column; gap:10px;}
  .row-item{display:flex; align-items:center; gap:12px; background:var(--white); border:0; border-radius:var(--r-lg); padding:10px 12px 10px 10px; width:100%; text-align:left; box-shadow:var(--shadow);}
  .row-item .t{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .row-item .name{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .meter{height:6px; background:var(--mist); border-radius:4px; overflow:hidden;}
  .meter i{display:block; height:100%; border-radius:4px;}
  .qty-col{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .qty-col b{font-family:var(--display); font-size:22px; line-height:1;}
  .price{color:var(--leaf); font-weight:700;}
  .tag{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .tag.ok{background:#E3F1E0; color:var(--leaf);} .tag.low{background:var(--amber-bg); color:var(--amber);} .tag.out{background:var(--red-bg); color:var(--red);}
  .tag.why{background:var(--violet-bg); color:var(--violet);}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
  .chip{border:1px solid var(--line); background:var(--white); border-radius:20px; padding:8px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; display:inline-flex; gap:6px; align-items:center;}
  .chip.on{background:var(--canopy); border-color:var(--canopy); color:#fff;}
  .chip .n{font-size:11px; background:rgba(0,0,0,.08); border-radius:10px; padding:1px 7px;}
  .chip.on .n{background:rgba(255,255,255,.2);}
  .fab{position:fixed; right:max(16px, calc(50% - 240px + 16px)); bottom:calc(130px + env(safe-area-inset-bottom)); height:56px; padding:0 20px 0 16px; border-radius:28px; border:0; background:var(--leaf); color:#fff; display:flex; align-items:center; gap:8px; font-weight:700; box-shadow:0 8px 20px rgba(46,125,50,.35); z-index:6;}

  /* buttons + forms */
  .btn{border:0; border-radius:var(--r-md); padding:15px; background:var(--leaf); color:#fff; font-weight:700; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn.dark{background:var(--canopy);}
  .btn.ghost{background:transparent; color:var(--leaf); box-shadow:inset 0 0 0 1.5px var(--leaf);}
  .btn.soft{background:#E3F1E0; color:var(--canopy);}
  .btn.danger{background:transparent; color:var(--red); box-shadow:inset 0 0 0 1.5px #E9B7B1;}
  .btn:disabled{opacity:.45;}
  .btn-row{display:flex; gap:10px;} .btn-row .btn{flex:1;}
  .group{background:var(--white); border-radius:var(--r-lg); padding:16px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow);}
  .group h3{font-size:16px;}
  label.f{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--muted);}
  label.f .hint{font-weight:400;}
  .input{width:100%; border:1.5px solid var(--line); border-radius:var(--r-sm); padding:12px; background:var(--paper); color:var(--ink); outline:none; font-weight:500;}
  .input:focus{border-color:var(--leaf); background:var(--white);}
  .input:disabled{opacity:.6;}
  textarea.input{min-height:90px; resize:vertical;}
  .err{background:var(--red-bg); color:var(--red); border-radius:var(--r-sm); padding:11px 13px; font-size:13.5px; font-weight:500;}
  .info{background:#E3F1E0; color:var(--canopy); border-radius:var(--r-sm); padding:12px 14px; font-size:14px;}
  .warn{background:var(--amber-bg); color:#6E4300; border-radius:var(--r-sm); padding:12px 14px; font-size:14px;}

  /* bottom nav with raised scan */
  .nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--white); box-shadow:0 -6px 24px rgba(23,63,39,.08); display:flex; align-items:flex-end; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); z-index:7; border-radius:22px 22px 0 0;}
  .nav button{flex:1; background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11.5px; font-weight:600; color:var(--muted); padding:6px 0;}
  .nav button.on{color:var(--leaf);}
  .nav button.on svg{stroke-width:2.3;}
  .nav .scan-btn{position:relative; top:-18px;}
  .nav .scan-btn .ring{width:62px; height:62px; border-radius:50%; background:var(--leaf); color:#fff; display:grid; place-items:center; box-shadow:0 0 0 5px var(--white), 0 8px 18px rgba(46,125,50,.4);}
  .nav .scan-btn.on .ring{background:var(--canopy);}
  .nav .scan-btn span{margin-top:2px;}

  /* scanner */
  .scanner{background:#0C1A10; min-height:100vh; color:#fff; display:flex; flex-direction:column;}
  .scanner .topbar{background:transparent; border:0; color:#fff; backdrop-filter:none;}
  .viewfinder{position:relative; flex:1; min-height:400px; margin:0 14px; border-radius:28px; background:#000; overflow:hidden;}
  .viewfinder video{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .frame{position:absolute; inset:16% 12%; pointer-events:none;}
  .frame i{position:absolute; width:40px; height:40px; border:4px solid var(--sprout);}
  .frame i:nth-child(1){top:0; left:0; border-right:0; border-bottom:0; border-radius:14px 0 0 0;}
  .frame i:nth-child(2){top:0; right:0; border-left:0; border-bottom:0; border-radius:0 14px 0 0;}
  .frame i:nth-child(3){bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 14px;}
  .frame i:nth-child(4){bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 14px 0;}
  .vf-msg{position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:rgba(255,255,255,.75);}
  .shutter-row{display:flex; align-items:center; justify-content:space-around; padding:18px 16px 6px;}
  .shutter{width:80px; height:80px; border-radius:50%; border:5px solid #fff; background:var(--leaf); box-shadow:0 0 0 4px rgba(181,224,108,.35);}
  .shutter:disabled{opacity:.5;}
  .round{width:52px; height:52px; border-radius:50%; border:0; background:rgba(255,255,255,.12); color:#fff; display:grid; place-items:center;}
  .organs{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:14px 16px 0;}
  .organs .chip{background:transparent; color:#fff; border-color:rgba(255,255,255,.3);}
  .organs .chip.on{background:var(--sprout); color:var(--canopy); border-color:var(--sprout);}

  /* result hero */
  .photo-hero{position:relative; height:300px; background:#0C1A10 center/cover no-repeat; color:#fff; display:flex; flex-direction:column; justify-content:space-between; border-radius:0 0 30px 30px; overflow:hidden;}
  .photo-hero::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 30%, rgba(8,30,15,.85) 100%);}
  .photo-hero > *{position:relative; z-index:1;}
  .photo-hero .bar-top{display:flex; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 10px 0;}
  .photo-hero .bar-top .icon-btn{color:#fff; background:rgba(0,0,0,.25); backdrop-filter:blur(6px);}
  .photo-hero .caption{padding:0 18px 20px; display:flex; align-items:flex-end; gap:14px;}
  .photo-hero h1{font-size:28px; font-weight:800; line-height:1.1;}
  .photo-hero .sci{font-style:italic; opacity:.85;}
  .ring-conf{flex:none; width:68px; height:68px; position:relative;}
  .ring-conf svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-conf b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--display); font-size:17px;}
  .scanline{position:absolute; left:0; right:0; height:3px; background:var(--sprout); box-shadow:0 0 18px 4px rgba(181,224,108,.7); top:10%; animation:sweep 1.4s ease-in-out infinite alternate; z-index:2;}
  @keyframes sweep{to{top:85%}}
  .stock-card{display:flex; gap:12px; align-items:center; background:var(--white); border:0; border-radius:var(--r-lg); padding:12px; box-shadow:var(--shadow); width:100%; text-align:left;}
  .stock-card.match{box-shadow:inset 0 0 0 2px var(--leaf), var(--shadow);}
  .stock-big{font-family:var(--display); font-size:34px; font-weight:800; line-height:1;}
  .facts{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .fact{background:var(--mist); border-radius:var(--r-sm); padding:10px 12px;}
  .fact small{display:block; color:var(--muted); font-size:12px;}
  .fact b{font-weight:600;}

  /* details banner */
  .banner{position:relative; height:240px; overflow:hidden; border-radius:0 0 30px 30px; background:var(--mist);}
  .banner .art{position:absolute; inset:0; width:100%; height:100%; border-radius:0;}
  .banner::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 35%);}
  .banner .bar-top{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 10px 0; z-index:2;}
  .banner .icon-btn{background:rgba(255,255,255,.85); color:var(--ink); backdrop-filter:blur(6px);}
  .sheet-card{margin:-34px 16px 0; position:relative; z-index:3;}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:10px 16px; font-size:14.5px;}
  .kv span:nth-child(odd){color:var(--muted);}
  .history{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
  .history:last-child{border-bottom:0;}
  .history .q{width:46px; height:32px; border-radius:10px; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:14px;}

  /* sale */
  .qty{display:flex; align-items:center; gap:4px; background:var(--mist); border-radius:14px; padding:4px;}
  .qty button{width:34px; height:34px; border-radius:10px; border:0; background:var(--white); display:grid; place-items:center; box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .qty b{min-width:26px; text-align:center; font-family:var(--display);}
  .total-bar{position:fixed; bottom:calc(122px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); width:calc(100% - 24px); max-width:456px; background:var(--canopy); color:#fff; border-radius:var(--r-lg); padding:14px 16px; display:flex; align-items:center; gap:14px; z-index:6; box-shadow:0 10px 26px rgba(23,63,39,.35);}
  .total-bar .btn{width:auto; padding:13px 18px; background:var(--sprout); color:var(--canopy);}

  /* reports */
  .tops{display:flex; flex-direction:column; gap:12px;}
  .tops .r{display:flex; align-items:center; gap:12px;}
  .tops .r .t{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;}
  .tops .r .t span{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chart svg{width:100%; height:auto; display:block;}

  /* profile */
  .profile-head{text-align:center; padding-bottom:26px;}
  .profile-head .avatar{width:88px; height:88px; font-size:36px; margin:8px auto 10px;}
  .avatar.photo{background-size:cover; background-position:center; color:transparent;}
  .avatar-wrap{position:relative; width:96px; margin:8px auto 10px; display:block; background:none; border:0; padding:0;}
  .avatar-wrap .avatar{width:96px; height:96px; font-size:40px; margin:0; box-shadow:0 0 0 4px rgba(255,255,255,.25);}
  .avatar-wrap .cam{position:absolute; right:-2px; bottom:2px; width:32px; height:32px; border-radius:50%; background:var(--white); color:var(--leaf); display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .avatar-wrap .cam svg{width:17px; height:17px;}
  .torch-on{background:rgba(246,196,83,.9) !important; color:#3A2A00 !important;}
  .menu-list{background:var(--white); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow);}
  .menu-list button{display:flex; align-items:center; gap:14px; width:100%; padding:16px; background:none; border:0; border-bottom:1px solid var(--line); text-align:left; font-weight:600;}
  .menu-list button:last-child{border-bottom:0;}
  .menu-list button > span:not(.ic){flex:1;}
  .menu-list .ic{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--mist); color:var(--leaf);}

  /* drawer, sheets, toast */
  .drawer-bg{position:fixed; inset:0; background:rgba(8,24,14,.5); z-index:20; display:none;}
  .drawer-bg.open{display:block;}
  .drawer{position:absolute; top:0; bottom:0; left:max(0px, calc(50% - 240px)); width:80%; max-width:330px; background:var(--canopy); color:#fff; padding:calc(26px + env(safe-area-inset-top)) 14px 24px; display:flex; flex-direction:column; gap:4px; overflow:hidden; animation:slide .2s ease-out;}
  @keyframes slide{from{transform:translateX(-30px); opacity:.4} to{transform:none; opacity:1}}
  .drawer .leaves{position:absolute; right:-40px; bottom:-30px; width:260px; opacity:.5; pointer-events:none;}
  .drawer .brand{display:flex; align-items:center; gap:12px; margin:0 6px 26px;}
  .drawer .brand b{font-family:var(--display); font-size:24px;}
  .drawer button.d{position:relative; display:flex; align-items:center; gap:16px; padding:13px 12px; border:0; background:none; color:#fff; border-radius:14px; font-size:15.5px; font-weight:600; text-align:left;}
  .drawer button.d.on{background:rgba(181,224,108,.18); color:var(--sprout);}
  .sheet-bg{position:fixed; inset:0; background:rgba(8,24,14,.5); z-index:30; display:flex; align-items:flex-end; justify-content:center;}
  .sheet{background:var(--white); width:100%; max-width:480px; border-radius:26px 26px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; max-height:88vh; overflow:auto; animation:up .2s ease-out;}
  .sheet::before{content:""; width:42px; height:5px; border-radius:3px; background:var(--line); align-self:center;}
  @keyframes up{from{transform:translateY(30px); opacity:.5} to{transform:none; opacity:1}}
  .sheet h2{font-size:21px;}
  .stepper{display:flex; align-items:center; gap:10px; justify-content:center;}
  .stepper button{width:52px; height:52px; border-radius:16px; border:0; background:var(--mist); display:grid; place-items:center;}
  .stepper input{width:110px; text-align:center; font-family:var(--display); font-size:30px; font-weight:700; border:0; background:transparent; outline:none;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:112px; background:var(--canopy); color:#fff; padding:13px 18px; border-radius:var(--r-md); z-index:40; max-width:min(440px, 92vw); font-size:14px; font-weight:500; display:flex; gap:10px; align-items:center; box-shadow:0 10px 26px rgba(0,0,0,.25); animation:up .2s ease-out;}
  .toast svg{color:var(--sprout);}

  /* splash + welcome */
  .splash{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:var(--canopy); color:#fff; position:relative; overflow:hidden;}
  .splash .leaves{position:absolute; inset:0; width:100%; height:100%;}
  .splash > *{position:relative;}
  .wordmark{font-family:var(--display); font-size:46px; font-weight:800; letter-spacing:-.03em;}
  .loading{width:56%; max-width:220px; height:5px; background:rgba(255,255,255,.15); border-radius:3px; overflow:hidden; margin-top:42px;}
  .loading i{display:block; height:100%; width:0; background:var(--sprout); border-radius:3px; animation:load 1.1s ease-out forwards;}
  @keyframes load{to{width:100%}}
  .welcome-top{background:var(--canopy); color:#fff; border-radius:0 0 34px 34px; padding:calc(40px + env(safe-area-inset-top)) 24px 34px; position:relative; overflow:hidden; text-align:center;}
  .welcome-top > *{position:relative;}
  .welcome-top .leaves{position:absolute; inset:0; width:100%; height:100%;}
  .empty{text-align:center; color:var(--muted); padding:22px 16px; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .empty .art{width:120px; height:120px; border-radius:50%; margin-bottom:8px;}
  .empty b{color:var(--ink); font-family:var(--display); font-size:18px;}
  /* flower colors + store logo */
  .cdot{width:12px; height:12px; border-radius:50%; display:inline-block; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); vertical-align:-1px;}
  .ctag{background:#F4EEF6; color:#5B3A6B;}
  .ctag .cdot{width:10px; height:10px;}
  .swatches{display:flex; flex-wrap:wrap; gap:8px;}
  .sw{display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--white); font:inherit; font-size:14px; color:var(--ink);}
  .sw.on{border-color:var(--leaf); background:#E3F1E0; font-weight:700;}
  .sw .cdot{width:16px; height:16px;}
  .logo{width:44px; height:44px; border-radius:14px; background:var(--sprout) center/cover no-repeat; color:var(--canopy); display:grid; place-items:center; flex:none; overflow:hidden; border:0; padding:0;}
  .logo.img{background-color:#fff;}
  .brandbar{display:flex; align-items:center; gap:10px; flex:1; min-width:0; margin:0 10px; background:none; border:0; color:inherit; padding:0; text-align:left;}
  .brandbar b{font-family:var(--display); font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .logo-edit{display:flex; align-items:center; gap:14px;}
  .logo-edit .logo{width:80px; height:80px; border-radius:22px; box-shadow:inset 0 0 0 1px var(--line);}
  .variants{display:flex; flex-direction:column;}
  .variants button{display:flex; align-items:center; gap:10px; padding:11px 0; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; font:inherit; color:var(--ink);}
  .variants button:last-child{border-bottom:0;}
  canvas{display:none;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="drawer-bg" id="drawer-bg"></div>
<div id="overlay"></div>
<input type="file" id="pick-gallery" accept="image/*" hidden>
<input type="file" id="pick-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="pick-logo" accept="image/*" hidden>
<input type="file" id="pick-backup" accept=".json,application/json" hidden>
<canvas id="canvas"></canvas>

<script>
/* =========================================================================
   FloraTrack — plant identification + stock for small plant vendors.
   Identification: Flask /identify (Pl@ntNet). Stock data: this device (localStorage).
   Screens are routed by the URL hash so the Android back button works.
   ========================================================================= */

// ---------- icons ----------
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  box:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/>',
  cart:'<path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  chart:'<path d="M5 20V11M11 20V5M17 20v-8M3 20h18"/>',
  leaf:'<path d="M5 21c0-9 5-15 15-16-1 10-7 15-15 16z"/><path d="M5 21 14 12"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13.5" r="3.5"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/>',
  menu:'<path d="M4 6h16M4 12h10M4 18h16"/>', back:'<path d="M15 5l-7 7 7 7"/>', chev:'<path d="m9 5 7 7-7 7"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>', trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  peso:'<path d="M8 20V4h5a4 4 0 0 1 0 8H8"/><path d="M5 7.5h14M5 10.5h14"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  backup:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>', check:'<path d="m5 12 5 5 9-10"/>',
  flash:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  flip:'<path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/>',
  sparkle:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
};
const ic = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

// Big decorative leaf silhouettes used behind the dark green headers.
function leavesBg(opacity=.16){
  const leaf = (x, y, s, r, o) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})" opacity="${o}">
    <path d="M0 0 C-40 -30 -44 -96 0 -140 C44 -96 40 -30 0 0Z" fill="#B5E06C"/>
    <path d="M0 0 V-132" stroke="#173F27" stroke-width="3" opacity=".5"/>
    <path d="M0 -40 L-22 -64 M0 -70 L-20 -94 M0 -40 L22 -64 M0 -70 L20 -94" stroke="#173F27" stroke-width="2.5" opacity=".45"/></g>`;
  return `<svg class="leaves" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    ${leaf(370, 250, 1.1, -28, opacity)}${leaf(330, 120, .7, 30, opacity * .8)}${leaf(20, 290, .9, 35, opacity * .7)}</svg>`;
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', {minimumFractionDigits:0, maximumFractionDigits:2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function ago(t){
  const d = Date.now() - t;
  if (d < 6e4) return 'Just now';
  if (d < 36e5) return Math.floor(d/6e4) + ' min ago';
  if (d < DAY) return Math.floor(d/36e5) + ' h ago';
  return new Date(t).toLocaleDateString('en-PH', {month:'short', day:'numeric'});
}
const fmtDate = t => new Date(t).toLocaleDateString('en-PH', {month:'short', day:'numeric', year:'numeric'});

// ---------- generated plant illustrations ----------
function hash(str){ let h = 2166136261; for (const c of String(str)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const GREENS = [['#2E7D32','#1B5E20'],['#4C9A2A','#33701B'],['#2F6F4E','#1F4D36'],['#6A9F3A','#4D7A26'],['#3E8E5E','#2A6744']];
const POTS = ['#D7C6AB','#B9CBB3','#C8896A','#59675F','#E6DCCB','#A7B9C9'];
const TINTS = ['#EEF4EC','#F1F0E6','#EAF2F4','#F4EFEA','#EDF3E4'];
/** Draws a potted plant. The plant type follows the category or name, so the same plant always looks the same. */
function plantSVG(seed, category='', name=''){
  const h = hash(seed + name);
  const [g1, g2] = GREENS[h % GREENS.length];
  const pot = POTS[(h >>> 3) % POTS.length], tint = TINTS[(h >>> 6) % TINTS.length];
  const text = (category + ' ' + name).toLowerCase();
  let type = ['sword','round','split','trailing'][(h >>> 9) % 4];
  if (/succulent|cactus|aloe|echeveria|haworthia/.test(text)) type = 'rosette';
  else if (/snake|sansevieria|dracaena|grass/.test(text)) type = 'sword';
  else if (/monstera|philodendron|anthurium/.test(text)) type = 'split';
  else if (/pothos|ivy|trailing|vine|hanging/.test(text)) type = 'trailing';
  const flower = /flower|lily|orchid|rose|anthurium|bougainvillea/.test(text) ? ['#F28CA8','#F6C453','#FFFFFF','#E8655A'][(h >>> 12) % 4] : null;
  const leaf = (x, y, rot, len, w, fill) => `<path transform="translate(${x} ${y}) rotate(${rot})" d="M0 0 C${-w} ${-len*.3} ${-w} ${-len*.75} 0 ${-len} C${w} ${-len*.75} ${w} ${-len*.3} 0 0Z" fill="${fill}"/>`;
  let p = '';
  if (type === 'sword'){
    [[-22,30,g2],[-8,40,g1],[6,44,g2],[20,32,g1],[-14,26,g1],[14,24,g2]].forEach(([r,l,f]) => p += leaf(50, 66, r, l, 6, f));
    p += `<g opacity=".35">${[[-8,40],[6,44]].map(([r,l]) => `<path transform="translate(50 66) rotate(${r})" d="M-2 -10 h4 M-3 -20 h6 M-3 -30 h6" stroke="#E8F2C8" stroke-width="1.6"/>`).join('')}</g>`;
  } else if (type === 'round'){
    [[-40,22],[-15,32],[12,30],[38,22],[0,40],[-28,36],[28,38]].forEach(([r,l], k) => {
      const rad = (r - 90) * Math.PI / 180, x = 50 + Math.cos(rad) * l, y = 66 + Math.sin(rad) * l;
      p += `<path d="M50 66 L${x.toFixed(1)} ${y.toFixed(1)}" stroke="${g2}" stroke-width="1.6"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${7 + (k % 3)}" fill="${k % 2 ? g1 : g2}"/>`;
    });
  } else if (type === 'split'){
    [[-38,34,g2],[30,36,g1],[-6,42,g1]].forEach(([r,l,f]) => {
      p += leaf(50, 66, r, l, 17, f);
      p += `<g transform="translate(50 66) rotate(${r})"><path d="M0 0 V${-l*.92}" stroke="${f === g1 ? g2 : g1}" stroke-width="1.5"/>`
        + [.35,.55,.75].map(k => `<path d="M-15 ${-l*k} L-4 ${-l*k+3} M15 ${-l*k} L4 ${-l*k+3}" stroke="${tint}" stroke-width="2.4" stroke-linecap="round"/>`).join('') + `</g>`;
    });
  } else if (type === 'trailing'){
    [[-1,0],[1,0],[-1,1],[1,1]].forEach(([dir, row]) => {
      const sx = 50 + dir * 10, ex = 50 + dir * (30 + row * 8), ey = 74 + row * 14;
      p += `<path d="M${sx} 64 Q${50 + dir * 34} ${54 + row * 6} ${ex} ${ey}" stroke="${g2}" stroke-width="1.6" fill="none"/>`;
      [.3,.6,.9].forEach((t, k) => {
        const x = sx + (ex - sx) * t + dir * 6 * Math.sin(t * 3), y = 62 + (ey - 62) * t - 6 * Math.sin(t * 3.1);
        p += leaf(x, y, dir * (60 + k * 20), 11, 7, k % 2 ? g1 : g2);
      });
    });
    [[-20,22,g1],[0,26,g2],[20,22,g1]].forEach(([r,l,f]) => p += leaf(50, 64, r, l, 8, f));
  } else {
    for (let k = 0; k < 10; k++) p += leaf(50, 60, k * 36, 20, 7, k % 2 ? g1 : g2);
    for (let k = 0; k < 6; k++) p += leaf(50, 60, k * 60 + 18, 12, 5, '#8CC56A');
  }
  if (flower){
    const spots = type === 'rosette' ? [[50,58]] : [[36,30],[60,24],[50,40]];
    spots.forEach(([x, y]) => { p += `<circle cx="${x}" cy="${y}" r="5" fill="${flower}"/><circle cx="${x}" cy="${y}" r="1.8" fill="#F6C453"/>`; });
  }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect x="-100" y="-50" width="300" height="200" fill="${tint}"/>
    <ellipse cx="50" cy="95" rx="24" ry="3" fill="#000" opacity=".06"/>
    ${p}
    <path d="M30 70 H70 L65 94 H35 Z" fill="${pot}"/><rect x="27" y="64" width="46" height="9" rx="3" fill="${pot}"/>
    <rect x="27" y="64" width="46" height="3" rx="1.5" fill="#fff" opacity=".25"/><path d="M33 75 H67 L66.4 78 H33.6Z" fill="#000" opacity=".07"/></svg>`;
}
/** Shows the plant's photo, or its illustration when it has none. */
function art(item, cls='s56'){
  if (item && item.photo) return `<span class="art ${cls}" style="background-image:url('${item.photo}')"></span>`;
  return `<span class="art ${cls}">${plantSVG(item ? item.id : 'x', item?.category || '', item?.name || '')}</span>`;
}

// ---------- storage ----------
const KEY = 'floratrack.v1';
const CATEGORIES = ['Indoor Plant','Outdoor Plant','Flowering Plant','Succulent','Cactus','Herb','Fruit Tree','Fern','Seedling','Other'];
const CARE = ['Easy','Moderate','Hard'];
function emptyState(){ return {profile:null, items:[], moves:[]}; }
let S = (() => { try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && Array.isArray(s.items) ? s : emptyState(); }catch(e){ return emptyState(); } })();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('Phone storage is full. Remove some photos or old plants, then try again.'); return false; }
}
const level = it => it.qty <= 0 ? 'out' : it.qty <= it.low ? 'low' : 'ok';
const LEVEL = {ok:['ok','In stock','#4C9A2A'], low:['low','Low stock','#E39A1B'], out:['out','Out of stock','#C2362B']};
const levelTag = it => { const [c, l] = LEVEL[level(it)]; return `<span class="tag ${c}">${l}</span>`; };
const meter = it => { const cap = Math.max(it.low * 3, it.qty, 1); return `<div class="meter"><i style="width:${Math.max(4, it.qty / cap * 100)}%;background:${LEVEL[level(it)][2]}"></i></div>`; };
const itemById = id => S.items.find(i => i.id === id);

// ---------- flower color variations ----------
// Picking from a fixed list keeps spellings consistent ("Red", never "red " or "Rd").
const COLORS = {Red:'#D93A3A', Pink:'#F28BB0', White:'#FFFFFF', Yellow:'#F5C842', Orange:'#F08A2C', Peach:'#F7B98E', Purple:'#7E4BB0',
  Lavender:'#B9A2E0', Blue:'#4A7BD8', Cream:'#F3E9C8', Green:'#7BC043', Mixed:'conic-gradient(#D93A3A 0 25%,#F5C842 0 50%,#F28BB0 0 75%,#FFFFFF 0)'};
/** "  light PINK " -> "Light Pink"; uses the list spelling when the color is on the list. */
function normColor(v){
  const s = String(v || '').trim().replace(/\s+/g, ' ');
  if (!s) return '';
  return Object.keys(COLORS).find(c => c.toLowerCase() === s.toLowerCase()) || s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}
function colorDot(c){
  let bg = COLORS[c];
  if (!bg){ const css = String(c).toLowerCase().replace(/[^a-z]/g, ''); bg = window.CSS && CSS.supports('color', css) ? css : 'linear-gradient(135deg,#ddd,#888)'; }
  return `<i class="cdot" style="background:${bg}"></i>`;
}
const colorTag = it => it.color ? `<span class="tag ctag">${colorDot(it.color)}${esc(it.color)}</span>` : '';
/** Plant name with its color, e.g. "Rose (Red)". */
const fullName = it => it.color ? `${it.name} (${it.color})` : it.name;
/** Other colors of the same plant (same scientific name or same plant name). */
const variantsOf = it => S.items.filter(i => i.id !== it.id && ((i.sci && it.sci && i.sci.trim().toLowerCase() === it.sci.trim().toLowerCase()) || i.name.trim().toLowerCase() === it.name.trim().toLowerCase()));
const nameKey = it => (it.name + ' ' + (it.color || '') + ' ' + it.category + ' ' + (it.sci || '')).toLowerCase();

// ---------- profile photo ----------
/** Owner's photo, or the first letter of the name when there is no photo. */
function avatarHTML(tag = 'span', attrs = ''){
  const p = S.profile || {};
  return p.photo ? `<${tag} class="avatar photo" style="background-image:url('${p.photo}')" ${attrs}></${tag}>`
                 : `<${tag} class="avatar" ${attrs}>${esc((p.owner || '?')[0].toUpperCase())}</${tag}>`;
}
/** Square 256px crop from the middle of the photo. */
async function makeAvatar(blob){
  const bmp = await createImageBitmap(blob);
  const side = Math.min(bmp.width, bmp.height), N = 256;
  const c = document.createElement('canvas'); c.width = c.height = N;
  c.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, N, N);
  return c.toDataURL('image/jpeg', .85);
}
function photoSheet(){
  sheet(`<h2>Profile photo</h2>
    <div class="logo-edit">${avatarHTML('span', 'style="width:80px;height:80px;font-size:34px;flex:none"')}<p class="sub" style="margin:0;font-size:14.5px">Shown on your profile and at the top of the Home screen.</p></div>
    <div class="btn-row"><button class="btn" data-act="avatar-camera">${ic('camera','sm')} Take photo</button><button class="btn soft" data-act="avatar-gallery">${ic('image','sm')} Gallery</button></div>
    ${S.profile.photo ? '<button class="btn ghost" data-act="avatar-remove">Remove photo</button>' : ''}`);
}

// ---------- store logo ----------
const logoHTML = (cls = 'logo') => S.profile?.logo ? `<span class="${cls} img" style="background-image:url('${S.profile.logo}')"></span>` : `<span class="${cls}">${ic('leaf')}</span>`;
/** Fits the logo into a 256x256 PNG (keeps transparency, nothing is cropped). */
async function makeLogo(file){
  const bmp = await createImageBitmap(file);
  const N = 256, k = Math.min(N / bmp.width, N / bmp.height);
  const c = document.createElement('canvas'); c.width = c.height = N;
  const w = bmp.width * k, h = bmp.height * k;
  c.getContext('2d').drawImage(bmp, (N - w) / 2, (N - h) / 2, w, h);
  return c.toDataURL('image/png');
}

/** Records a stock change. Returns an error message, or '' when it worked. */
function moveStock(item, type, qty, note=''){
  if (!Number.isInteger(qty) || qty <= 0) return 'Enter a quantity greater than zero.';
  const change = type === 'sale' ? -qty : qty;
  if (item.qty + change < 0) return `Only ${item.qty} ${esc(fullName(item))} left in stock.`;
  item.qty += change; item.updatedAt = Date.now();
  S.moves.push({id:uid(), itemId:item.id, name:fullName(item), type, qty:change, price:item.price, note, at:Date.now()});
  return '';
}

async function downscale(file, maxSide, quality=0.85){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', quality));
}
const blobToDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });

// ---------- identification (server: Pl@ntNet) ----------
async function identify(blob, organ){
  const form = new FormData();
  form.append('image', blob, 'photo.jpg');
  form.append('organ', organ || 'auto');
  let resp;
  try{ resp = await fetch('/identify', {method:'POST', body:form}); }
  catch(e){ throw new Error('No internet connection. Identification needs internet; your stock list still works offline.'); }
  let data = null;
  try{ data = await resp.json(); }catch(e){ data = null; }
  if (!resp.ok || !data) throw new Error((data && data.error) || `The server returned an error (${resp.status}). Try again in a moment.`);
  return data;
}
const genus = sci => (sci || '').trim().split(/\s+/)[0].toLowerCase();
const sciKey = v => (v || '').trim().toLowerCase();
const cap = v => v ? v[0].toUpperCase() + v.slice(1) : '';
/**
 * Compares an identification with the stock.
 *  exact   - plants that are the identified species
 *  similar - plants that look like it: another species the photo could be (Pl@ntNet's other
 *            guesses), same genus, then same family. In-stock plants are listed first.
 */
function stockMatches(matches){
  const ms = (matches || []).slice(0, 5);
  const top = ms[0];
  if (!top) return {exact:[], similar:[]};
  const exact = S.items.filter(it => it.sci && sciKey(it.sci) === sciKey(top.scientific_name));
  // Other colors of the same plant count as the same plant even if their scientific name was left blank.
  const names = new Set(exact.map(i => i.name.trim().toLowerCase()));
  S.items.forEach(it => { if (!exact.includes(it) && names.has(it.name.trim().toLowerCase())) exact.push(it); });
  exact.sort((a, b) => (b.qty > 0) - (a.qty > 0) || (a.color || '').localeCompare(b.color || ''));
  const used = new Set(exact.map(i => i.id));
  const similar = [];
  const add = (it, reason, score) => { if (used.has(it.id)) return; used.add(it.id); similar.push({it, reason, score}); };
  ms.slice(1).forEach(m => S.items
    .filter(it => it.sci && sciKey(it.sci) === sciKey(m.scientific_name))
    // A strong alternative guess outranks same-genus plants; a weak one ranks between genus and family.
    .forEach(it => add(it, `Looks similar · ${m.confidence}% match`, (m.confidence >= 20 ? 300 : 150) + m.confidence)));
  const g = genus(top.scientific_name);
  if (g) S.items.filter(it => it.sci && genus(it.sci) === g).forEach(it => add(it, `Same genus · ${cap(g)}`, 200));
  const fam = sciKey(top.family);
  if (fam) S.items.filter(it => sciKey(it.family) === fam).forEach(it => add(it, `Same family · ${top.family}`, 100));
  similar.sort((a, b) => (b.it.qty > 0) - (a.it.qty > 0) || b.score - a.score);
  return {exact, similar};
}
function displayName(m){ return (m.common_names && m.common_names[0]) || m.scientific_name; }

function salesByDay(days){
  const from = startOfDay(Date.now()) - (days - 1) * DAY;

}
